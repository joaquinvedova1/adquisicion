function updateProgress(){const s=seen(); const pct=Math.round(s.length/DATA.topics.length*100); $('progbar').style.width=pct+'%'; $('progtext').textContent=`${s.length}/${DATA.topics.length} temas vistos · ${pct}%`;}
function renderNav(){
 const fixed=[['home','Inicio / mapa global','🏠'],['formulas','Banco de fórmulas','ƒx'],['symbols','Diccionario de símbolos','α'],['tps','TPs y casos aplicados','🧪'],['cards','Datacards','🃏'],['quiz','Mini test','✅'],['normas','Normas y software','§']];
 let html=fixed.map(([id,label,ico])=>`<button class="navbtn ${state.view===id?'active':''}" onclick="setView('${id}')"><span class="ico">${ico}</span><span>${label}</span></button>`).join('');
 html += `<div class="side-title">Temas</div>` + DATA.topics.map(t=>`<button class="navbtn ${state.view==='topic'&&state.topic===t.id?'active':''}" onclick="setView('topic','${t.id}')"><span class="n">${t.num}</span><span>${esc(t.titulo)}<small>${esc(t.tp||'')}</small></span></button>`).join('');
 $('mainnav').innerHTML=html; updateProgress();
}
function hero(){
 return `<section class="hero"><div class="hero-title"><div class="hero-icon">📘</div><div><h1>Adquisición y Análisis de Datos Energéticos</h1><p>Base de estudio para final: conceptos mínimos, fórmulas explicadas, procedimientos y TPs.</p></div></div><div class="banner">La materia se estudia con una lógica: <b>dato → unidad → fórmula → cálculo → interpretación</b>. Los TPs son el mapa práctico: demanda, transmitancia y CE3X.</div><div class="quick"><div class="card" onclick="setView('tps')"><span class="tag tp">TP1 · TP2 · TP3</span><h3>Casos aplicados</h3><p>Recetas paso a paso.</p></div><div class="card" onclick="setView('formulas')"><span class="tag form">Fórmulas</span><h3>Banco explicado</h3><p>Qué significa cada símbolo.</p></div><div class="card" onclick="setView('symbols')"><span class="tag soft">Símbolos</span><h3>Diccionario rápido</h3><p>A_ext, ψ, K, ΔT...</p></div><div class="card" onclick="setView('quiz')"><span class="tag exam">Examen</span><h3>Mini test</h3><p>Preguntas de repaso.</p></div></div></section><h2 class="section-title">Mapa general por tema</h2><div class="grid">${DATA.topics.map(t=>`<div class="card"><span class="tag">Tema ${t.num}</span><span class="tag tp">${esc(t.tp||'')}</span><h3>${esc(t.titulo)}</h3><p>${esc(t.idea)}</p><button class="btn primary" onclick="setView('topic','${t.id}')">Abrir tema</button></div>`).join('')}</div><h2 class="section-title">Ruta recomendada</h2><div class="grid2"><div class="study-block tp"><h4>1. Empezá por los TPs</h4><ol><li>TP1: demanda de calefacción.</li><li>TP2: transmitancia térmica global.</li><li>TP3: CE3X y mejoras.</li></ol></div><div class="study-block clave"><h4>2. Después banco de fórmulas</h4><p>No memorices letras sueltas. Memorizá qué representa cada símbolo y qué unidad lleva.</p></div><div class="study-block ojo"><h4>3. Interpretación</h4><p>En examen no alcanza el número: hay que decir si cumple, si mejora o qué significa.</p></div><div class="study-block err"><h4>4. Errores críticos</h4><p>Unidades, caudal l/s vs m³/h, U vs ψ, demanda vs consumo y costos del TP3.</p></div></div>`;
}
function topicPage(t){
 const read=seen().includes(t.id); const tabs=['claves','resumen','conceptos','formulas','paso','caso','ojo','test'];
 const formulaObjs=(t.formulas||[]).map(id=>DATA.formulas.find(f=>f.id===id)).filter(Boolean);
 let body='';
 if(state.tab==='claves') body=`<div class="study-block clave"><h3>Idea madre</h3><p>${esc(t.idea)}</p></div><div class="study-block"><h3>Mapa rápido para estudiar</h3><ol>${t.mapa.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`;
 if(state.tab==='resumen') body=`<div class="study-block clave"><h3>Resumen para estudiar</h3><p>Esta sección explica el tema con más desarrollo, sin irse a la bibliografía completa.</p></div>${(t.resumen||[]).map(x=>`<div class="study-block"><h3>${esc(x.h||'Resumen')}</h3><p>${esc(x.p||x)}</p></div>`).join('')}`;
 if(state.tab==='conceptos') body=`<div class="study-block"><h3>Conceptos clave explicados simple</h3><ul>${t.conceptos.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
 if(state.tab==='formulas') body=`<h3>Fórmulas del tema</h3>${formulaObjs.length?formulaObjs.map(formulaCard).join(''):'<div class="study-block ojo">Este tema es más de procedimiento/software que de cálculo manual. Estudiá el flujo de carga, verificación e informe.</div>'}`;
 if(state.tab==='paso') body=`<div class="study-block paso"><h3>Procedimiento tipo examen</h3><ol>${t.paso.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`;
 if(state.tab==='caso') body=`<div class="study-block tp"><h3>Caso aplicado / conexión con TP</h3><p>${esc(t.caso)}</p></div>`;
 if(state.tab==='ojo') body=`<div class="study-block ojo"><h3>Ojo examen</h3><p>${esc(t.ojo)}</p></div><div class="study-block err"><h3>Errores típicos</h3><ul>${t.errores.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
 if(state.tab==='test') body=`<div class="study-block"><h3>Preguntas rápidas</h3>${t.test.map(qa=>`<details><summary>${esc(qa[0])}</summary><p>${esc(qa[1])}</p></details>`).join('')}</div>`;
 return `<section class="topic-shell"><div class="topic-head"><div class="topic-icon">${topicIcons[t.num-1]||'📌'}</div><div style="flex:1"><div><span class="tag">Tema ${t.num}</span><span class="tag tp">${esc(t.tp||'sin TP directo')}</span></div><h1 class="topic-title">${esc(t.titulo)}</h1><p class="topic-sub">${esc(t.idea)}</p></div><button class="btn primary" onclick="toggleSeen('${t.id}')">${read?'✓ Tema visto':'✓ Marcar tema'}</button></div><div class="banner">${esc(t.ojo || t.idea)}</div><div class="chips">${tabs.map(tab=>`<button class="chip ${state.tab===tab?'active':''}" onclick="setTab('${tab}')">${tabLabel(tab)}</button>`).join('')}</div><div>${body}</div></section>`;
}
function tabLabel(x){return {claves:'Claves',resumen:'Resumen',conceptos:'Conceptos',formulas:'Fórmulas',paso:'Paso a paso',caso:'Casos / TP',ojo:'Ojo examen',test:'Mini test'}[x]||x}
function formulaCard(f){
 return `<article class="card formula-card" id="${esc(f.id)}"><button class="copy" onclick="copyFormula('${esc(f.id)}')">Copiar</button><span class="tag form">${esc(f.tema)}</span><span class="tag tp">${esc(f.tp)}</span><h3>${esc(f.nombre)}</h3><div class="formula-sub">${esc(f.sirve)}</div><div class="eq" data-eq="${esc(f.eq)}">${esc(f.eq)}</div>${f.extra?`<div class="study-block clave"><b>Traducción simple:</b> ${esc(f.extra)}</div>`:''}<div class="explain-grid"><div><h4>Cuándo se usa</h4><p>${esc(f.cuando)}</p><h4>Pasos</h4><ol>${f.pasos.map(p=>`<li>${esc(p)}</li>`).join('')}</ol></div><div><h4>Símbolos y unidades</h4><div class="grid2" style="grid-template-columns:1fr">${f.vars.map(v=>`<div class="symbol-card"><b>${esc(v[0])}</b><span>${esc(v[1])}</span><br><small>Unidad: ${esc(v[2])}</small></div>`).join('')}</div></div></div><div class="study-block err"><b>Error común:</b> ${esc(f.error)}</div><details><summary>Ejemplo corto</summary><p>${esc(f.ejemplo)}</p></details></article>`;
}
function formulasPage(){
 const tags=['todas','TP1','TP2','TP3','T1','T4','T9'];
 return `<h2 class="section-title">Banco de fórmulas</h2><div class="study-block clave"><b>Cómo estudiar esta sección:</b> no mires solo la ecuación. Mirá primero el uso, después cada símbolo y recién ahí el ejemplo.</div><div class="chips">${tags.map(x=>`<button class="chip ${state.tab===x?'active':''}" onclick="state.tab='${x}';renderMain()">${x}</button>`).join('')}</div>${DATA.formulas.filter(f=>state.tab==='claves'||state.tab==='todas'||!state.tab?true:(f.tema+' '+f.tp).toLowerCase().includes(state.tab.toLowerCase())).map(formulaCard).join('')}`;
}
function symbolsPage(){return `<h2 class="section-title">Diccionario de símbolos</h2><div class="study-block ojo"><b>Para no perderte:</b> muchas letras se parecen, pero no significan lo mismo. A_ext no es área exterior: es abertura de extracción.</div><table><thead><tr><th>Símbolo</th><th>Qué significa</th><th>Unidad</th><th>Dónde aparece</th></tr></thead><tbody>${DATA.symbols.map(s=>`<tr><td><b>${esc(s[0])}</b></td><td>${esc(s[1])}</td><td>${esc(s[2])}</td><td>${esc(s[3])}</td></tr>`).join('')}</tbody></table><h2 class="section-title">Unidades que más te pueden hacer errar</h2><table><thead><tr><th>Unidad</th><th>Qué mide</th><th>Conversión útil</th><th>Error típico</th></tr></thead><tbody>${DATA.units.map(u=>`<tr><td><b>${esc(u[0])}</b></td><td>${esc(u[1])}</td><td>${esc(u[2])}</td><td>${esc(u[3])}</td></tr>`).join('')}</tbody></table>`}
function renderBlockItem(x){
 if(Array.isArray(x)) return `<li><b>${esc(x[0])}</b>: ${esc(x[1]||'')}</li>`;
 return `<li>${esc(x)}</li>`;
}
function tpsPage(){return `<h2 class="section-title">TPs y casos aplicados</h2><div class="study-block clave">Estos TPs son la columna vertebral práctica. En examen probablemente cambien números, pero se mantiene la receta: leer datos, cargar modelo, calcular, interpretar y justificar.</div>${DATA.tps.map(tp=>`<section class="card" id="${esc(tp.id)}"><span class="tag tp">${esc(tp.id.toUpperCase())}</span><span class="tag soft">${esc(tp.temas)}</span><h3>${esc(tp.titulo)}</h3><p><b>Objetivo:</b> ${esc(tp.objetivo)}</p><div class="grid2"><div class="study-block"><h4>Datos que miro primero</h4><ul>${tp.datos.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="study-block clave"><h4>Fórmulas/procedimientos</h4><ul>${tp.formulas.map(id=>{let f=DATA.formulas.find(ff=>ff.id===id);return `<li>${f?esc(f.nombre):esc(id)}</li>`}).join('')}</ul></div></div>${tp.bloques?`<div class="study-block ojo"><h4>Cómo usar esta sección</h4><p>No memorices valores de un caso concreto. Usá estas tarjetas para saber qué te dan, qué calculás, qué suponés, dónde lo cargás y cómo lo interpretás.</p></div><div class="grid2">${tp.bloques.map(b=>`<div class="study-block ${esc(b.tipo||'')}"><h4>${esc(b.titulo)}</h4><ul>${(b.items||[]).map(renderBlockItem).join('')}</ul></div>`).join('')}</div>`:''}<div class="study-block paso"><h4>Receta paso a paso</h4><ol>${tp.procedimiento.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>${tp.resultados?`<div class="study-block"><h4>Resultados que conviene recordar</h4><ul>${tp.resultados.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}<div class="study-block err"><h4>Errores típicos</h4><ul>${tp.errores.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="study-block ojo"><b>Posible examen:</b> ${esc(tp.examen)}</div></section>`).join('')}<h2 class="section-title">Qué hago según lo que me pidan</h2><table><thead><tr><th>Si me piden...</th><th>Voy a...</th><th>Datos necesarios</th><th>No olvidar</th></tr></thead><tbody><tr><td>Demanda de calefacción</td><td>TP1</td><td>q, aberturas, U, A, ΔT</td><td>convertir l/s a m³/h si corresponde</td></tr><tr><td>K global / transmitancia</td><td>TP2</td><td>capas, U, A, ψ, L</td><td>U es superficial; ψ es lineal</td></tr><tr><td>CE3X / mejoras</td><td>TP3</td><td>datos generales, envolvente, instalaciones, costes</td><td>explicar por qué mejora la letra o el ahorro</td></tr><tr><td>Auditoría energética con software</td><td>TP Auditoría</td><td>datos dados, cálculos, supuestos, caso base, mejoras y economía</td><td>seguir el orden: generales → envolvente → cerramientos → puentes → huecos → instalaciones → resultado</td></tr></tbody></table>`}
function cardsPage(){const k=known();return `<h2 class="section-title">Datacards</h2><div class="flashgrid">${DATA.cards.map((c,i)=>`<div class="flash" onclick="this.classList.toggle('flip')"><div class="flashinner"><div class="front"><span class="tag">${esc(c[2])}</span><span class="tag tp">${esc(c[3])}</span><h3>${esc(c[0])}</h3><button class="known" onclick="event.stopPropagation();toggleKnown(${i})">${k.includes(i)?'✓ sabida':'marcar'}</button></div><div class="back"><p>${esc(c[1])}</p><button class="known" onclick="event.stopPropagation();toggleKnown(${i})">${k.includes(i)?'✓ sabida':'marcar'}</button></div></div></div>`).join('')}</div>`}
function quizPage(){const q=DATA.quiz[state.quizIndex%DATA.quiz.length];return `<h2 class="section-title">Mini test</h2><div class="card"><span class="tag">${esc(q.tema)}</span><span class="tag tp">${esc(q.tp)}</span><h3>${esc(q.q)}</h3>${q.opts.map((o,i)=>`<button class="qopt" onclick="answer(${i})">${esc(o)}</button>`).join('')}<div id="qexp" class="study-block hidden"></div><div class="toolbar"><button class="btn" onclick="prevQ()">Anterior</button><button class="btn primary" onclick="nextQ()">Siguiente</button></div><p class="mini">Pregunta ${state.quizIndex+1} de ${DATA.quiz.length}</p></div>`}
function normasPage(){return `<h2 class="section-title">Normas y software</h2><table><thead><tr><th>Tema</th><th>Norma / herramienta</th><th>Para qué sirve</th><th>Cómo recordarla</th></tr></thead><tbody>${DATA.normas.map(n=>`<tr><td>${esc(n[0])}</td><td><b>${esc(n[1])}</b></td><td>${esc(n[2])}</td><td>${esc(n[3])}</td></tr>`).join('')}</tbody></table><div class="study-block err"><b>Advertencia:</b> en los TPs se remarca no usar legislación derogada. Si no estás seguro, marcá duda/revisar.</div>`}
function searchPage(q){const term=q.toLowerCase();let res=[];DATA.topics.forEach(t=>{let blob=[t.titulo,t.idea,t.tp,...(t.resumen||[]).map(x=>(x.h||'')+' '+(x.p||x)),...t.conceptos,...t.paso,...t.errores].join(' ').toLowerCase();if(blob.includes(term))res.push(['Tema '+t.num,t.titulo,t.idea,()=>setView('topic',t.id)]);});DATA.formulas.forEach(f=>{let blob=[f.nombre,f.eq,f.sirve,f.cuando,f.error,f.tema,f.tp,...f.vars.flat()].join(' ').toLowerCase();if(blob.includes(term))res.push(['Fórmula',f.nombre,f.sirve,()=>{state.search='';$('search').value='';setView('formulas');setTimeout(()=>document.getElementById(f.id)?.scrollIntoView({behavior:'smooth'}),80)}]);});DATA.tps.forEach(tp=>{let blob=[tp.titulo,tp.objetivo,tp.temas,...tp.datos,...tp.procedimiento,...tp.errores].join(' ').toLowerCase();if(blob.includes(term))res.push(['TP',tp.titulo,tp.objetivo,()=>{state.search='';$('search').value='';setView('tps');setTimeout(()=>document.getElementById(tp.id)?.scrollIntoView({behavior:'smooth'}),80)}]);});lastSearchActions=res.map(r=>r[3]);return `<h2 class="section-title">Resultados de búsqueda: “${esc(q)}”</h2>${res.length?res.map((r,i)=>`<div class="resultitem" onclick="lastSearchActions[${i}]()"><span class="tag">${esc(r[0])}</span><h3>${esc(r[1])}</h3><p>${esc(r[2])}</p></div>`).join(''):'<div class="study-block err">No encontré resultados. Probá con: Aext, K global, CE3X, ventilación, TP1.</div>'}`}
let lastSearchActions=[];
function renderMain(){const c=$('content');if(state.search){c.innerHTML=searchPage(state.search);return}if(state.view==='home')c.innerHTML=hero();if(state.view==='topic')c.innerHTML=topicPage(DATA.topics.find(t=>t.id===state.topic)||DATA.topics[0]);if(state.view==='formulas')c.innerHTML=formulasPage();if(state.view==='symbols')c.innerHTML=symbolsPage();if(state.view==='tps')c.innerHTML=tpsPage();if(state.view==='cards')c.innerHTML=cardsPage();if(state.view==='quiz')c.innerHTML=quizPage();if(state.view==='normas')c.innerHTML=normasPage();}
function render(){renderNav();renderMain()}
function toggleSeen(id){let s=seen();s=s.includes(id)?s.filter(x=>x!==id):[...s,id];LS.set('adq_seen',s);render()}
function toggleKnown(i){let k=known();k=k.includes(i)?k.filter(x=>x!==i):[...k,i];LS.set('adq_known',k);renderMain()}
function answer(i){const q=DATA.quiz[state.quizIndex%DATA.quiz.length];document.querySelectorAll('.qopt').forEach((b,idx)=>{b.classList.add(idx===q.ok?'correct':(idx===i?'wrong':''));b.disabled=true});const exp=$('qexp');exp.classList.remove('hidden');exp.innerHTML=`<b>${i===q.ok?'Correcto':'Revisar'}</b><p>${esc(q.exp)}</p>`}
function nextQ(){state.quizIndex=(state.quizIndex+1)%DATA.quiz.length;renderMain()}function prevQ(){state.quizIndex=(state.quizIndex-1+DATA.quiz.length)%DATA.quiz.length;renderMain()}
function copyFormula(id){const el=document.querySelector('#'+CSS.escape(id)+' .eq'); if(!el)return; navigator.clipboard?.writeText(el.textContent.trim());}
$('search').addEventListener('input',e=>{state.search=e.target.value.trim();renderMain()});$('themeBtn').addEventListener('click',()=>{document.body.classList.toggle('dark');LS.set('adq_theme',document.body.classList.contains('dark')?'dark':'light')});$('printBtn').addEventListener('click',()=>window.print());$('resetBtn').addEventListener('click',()=>{if(confirm('¿Borrar progreso guardado?')){localStorage.removeItem('adq_seen');localStorage.removeItem('adq_known');render()}});if(LS.get('adq_theme','light')==='dark')document.body.classList.add('dark');state.tab='claves';render();
</script>
</body>
</html>
